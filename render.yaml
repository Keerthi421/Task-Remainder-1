services:
  - type: web
    name: task-reminder-api
    env: python
    region: singapore          # closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-reminder-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure random value
      - key: BREVO_API_KEY
        sync: false            # you fill this in the Render dashboard
      - key: SENDER_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: APP_BASE_URL
        sync: false            # set to your Render service URL after first deploy

databases:
  - name: task-reminder-db
    databaseName: taskreminder
    plan: free
    region: singapore
