<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Task Reminder</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <nav class="navbar">
    <a class="navbar-brand" href="/">TR</a>
    <ul class="navbar-links">
      <li><a href="/login">Sign In</a></li>
    </ul>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">New<br><span style="color:var(--text-dim)">Password.</span></h1>
      <p class="auth-sub" id="page-sub">Enter a new password for your account.</p>

      <!-- Reset form (shown when token present in URL) -->
      <form id="reset-form" class="auth-form active">
        <div class="form-group">
          <label for="new-password">New Password <span style="font-size:10px;color:var(--text-dim);">(min 6 chars)</span></label>
          <input type="password" id="new-password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;" id="reset-btn">Set New Password</button>
        <p id="reset-error" class="msg-error"></p>
        <p id="reset-success" class="msg-success" style="display:none;"></p>
      </form>

      <!-- No-token fallback: show a request form -->
      <form id="forgot-form" class="auth-form" style="display:none;">
        <div class="form-group">
          <label for="forgot-email">Email Address</label>
          <input type="email" id="forgot-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Send Reset Link</button>
        <p id="forgot-error" class="msg-error"></p>
        <p id="forgot-success" class="msg-success" style="display:none;"></p>
      </form>

      <p style="text-align:center;margin-top:16px;">
        <a href="/login" style="font-size:12px;color:var(--text-dim);text-decoration:none;">← Back to Sign In</a>
      </p>
    </div>
  </div>

  <script>
    /* ── Particle canvas ── */
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      function createStars(n) {
        stars = [];
        for (let i = 0; i < n; i++)
          stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                       r: Math.random()*1.1+0.2, alpha: Math.random()*0.5+0.1, speed: Math.random()*0.25+0.05 });
      }
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        stars.forEach(s => {
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(245,245,245,${s.alpha})`; ctx.fill();
          s.y+=s.speed; if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
        });
        requestAnimationFrame(draw);
      }
      resize(); createStars(160); draw();
      window.addEventListener('resize', ()=>{ resize(); createStars(160); });
    })();

    /* ── Determine mode ── */
    const params = new URLSearchParams(location.search);
    const token  = params.get('token');

    if (!token) {
      // No token: show the "request a reset link" form instead
      document.getElementById('reset-form').style.display  = 'none';
      document.getElementById('forgot-form').style.display = 'block';
      document.getElementById('page-sub').textContent = 'Enter your email and we\'ll send a reset link.';
    }

    /* ── Reset password ── */
    document.getElementById('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pwd  = document.getElementById('new-password').value;
      const conf = document.getElementById('confirm-password').value;
      const err  = document.getElementById('reset-error');
      const ok   = document.getElementById('reset-success');
      const btn  = document.getElementById('reset-btn');
      err.style.display = 'none';
      ok.style.display  = 'none';
      if (pwd !== conf) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const r = await fetch('/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pwd })
        });
        const d = await r.json();
        if (r.ok) {
          ok.textContent = '✓ Password updated! Redirecting to sign in…';
          ok.style.display = 'block';
          setTimeout(() => window.location.href = '/login', 2000);
        } else {
          err.textContent = d.detail || 'Failed. The link may have expired.';
          err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Set New Password';
        }
      } catch(_) {
        err.textContent = 'Network error. Please try again.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Set New Password';
      }
    });

    /* ── Request reset link ── */
    document.getElementById('forgot-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      const err   = document.getElementById('forgot-error');
      const ok    = document.getElementById('forgot-success');
      err.style.display = 'none';
      ok.style.display  = 'none';
      try {
        const r = await fetch('/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const d = await r.json();
        ok.textContent = d.message || 'Check your inbox for the reset link.';
        ok.style.display = 'block';
      } catch(_) {
        err.textContent = 'Network error. Please try again.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
