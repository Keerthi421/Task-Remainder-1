<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Task Reminder</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <!-- Sticky nav -->
  <nav class="navbar">
    <a class="navbar-brand" href="/">TR</a>
    <ul class="navbar-links">
      <li><span id="nav-email" style="color:var(--text-dim);font-size:12px;letter-spacing:0.5px;"></span></li>
      <li><button class="logout-link" onclick="logout()">Logout</button></li>
    </ul>
  </nav>

  <div class="app-wrap">
    <div class="app-inner">

      <!-- ── Sidebar: form ── -->
      <aside>
        <div class="form-card">
          <div class="form-card-label">
            <span class="hint-dot"></span> New Reminder
          </div>
          <div class="section-heading" style="font-size:1.8rem;margin-bottom:24px;">
            Add Task.<br><span class="dim">Stay Ahead.</span>
          </div>

          <form id="task-form">
            <div class="form-group">
              <label for="title">Task Title</label>
              <input type="text" id="title" required placeholder="e.g. Submit project report">
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" rows="3" placeholder="What needs to be done..."></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="due_date">Notify At (IST)</label>
                <input type="datetime-local" id="due_date" required title="When should the email be sent?">
              </div>
              <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority">
                  <option value="low">Low</option>
                  <option value="moderate">Moderate</option>
                  <option value="high">High</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Schedule Reminder</button>
          </form>

          <p class="hint-note">
            <span class="hint-dot"></span>
            Email is sent automatically to your account address.
          </p>
        </div>
      </aside>

      <!-- ── Main: task list ── -->
      <main>
        <div class="task-list-head">
          <h2 class="section-heading" style="margin-bottom:0;">
            Your Tasks.<br><span class="dim">Upcoming.</span>
          </h2>
          <span class="task-count" id="task-count">— tasks</span>
        </div>

        <div id="tasks-container" class="task-list" style="margin-top:24px;">
          <div class="empty-state">
            <span class="empty-icon">🕓</span>
            Loading your reminders…
          </div>
        </div>
      </main>

    </div>
  </div>

  <div id="toast"></div>

  <script src="/static/script.js"></script>

  <!-- Particle canvas -->
  <script>
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      function createStars(n) {
        stars = [];
        for (let i = 0; i < n; i++)
          stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.1+0.2, alpha: Math.random()*0.45+0.08, speed: Math.random()*0.2+0.04 });
      }
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        stars.forEach(s => {
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(245,245,245,${s.alpha})`; ctx.fill();
          s.y+=s.speed; if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
        });
        requestAnimationFrame(draw);
      }
      resize(); createStars(180); draw();
      window.addEventListener('resize', ()=>{ resize(); createStars(180); });
    })();
  </script>
</body>
</html>
